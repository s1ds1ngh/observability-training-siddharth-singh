# Application
spring.application.name=inventory-service
server.port=8080

# Actuator - Expose health, info, prometheus, metrics and tracing endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics,trace
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Distributed tracing configuration (Micrometer Tracing + OpenTelemetry)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# OTLP exporter endpoint
# For local development without Docker, point to a locally running collector (default 4318)
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# Metrics - Global tags applied to all metrics
management.metrics.tags.application=inventory-service

# Logging levels
logging.level.com.nashtech.observability=DEBUG
logging.level.root=INFO
