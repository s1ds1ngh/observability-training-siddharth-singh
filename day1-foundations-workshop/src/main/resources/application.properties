# Application
spring.application.name=inventory-service
server.port=8080

# Actuator - Expose health, info, prometheus, and metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Metrics - Global tags applied to all metrics
management.metrics.tags.application=inventory-service

# Logging levels
logging.level.com.nashtech.observability=DEBUG
logging.level.root=INFO
